<html>
<head><title>online student registeration form</title></head>
<body bgcolor="#82CAFF">
<h1 align="center">Student Registration Form</h1>
<form action="R.html">
<label>Student Name:</label><br>
<input type="text" required placeholder="enter your full name"><br><br>
<label>Father's Name:</label><br>
<input type="text" required placeholder="enter full name"><br><br>
<label>Email:</label><br>
<input type="email" required placeholder="enter your email address"><br><br>
<label>Age:</label><br>
<input type="number" required placeholder="enter your age"><br><br>
<label>Mobile Number:</label><br>
<input type="text" value="" required placeholder="+91- enter your mobile number"><br><br>
<label>Date of birth:</label><br>
<input type="date" required><br><br>
<label>Gender:</label><br>
<input type="radio" required name="gender"value="male">Male
<input type="radio" required name="gender"value"female">Female<br><br>
<label>Course:</label>
<select required>
<option>select your course</option>
<option>BCA</option>
<option>BCOM</option>
<option>BSC</option>
<option>BBA</option>
<option>BA</option>
</SELECT><br><br>
<label>Student Photo:</label>
<input type="file" required><br><br>
<label>Address:</label><br>
<input type="text" required placeholder="enter your address"><br><br><br>
<input type="submit" value="Register"><br><br>
if you are an admin then<a href="admin.html"> click here</a><br><br>
</form>
</body>
</html>
